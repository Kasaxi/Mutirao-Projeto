[package]
name = "nucleo"
version = "0.1.0"
edition = "2021"
description = "Núcleo do Mutirão: modelo, banco e regras. Sem dependência de UI."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
